services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: local_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  postgres:
    image: postgres:15-alpine
    container_name: local_postgres
    environment:
      POSTGRES_USER: pet_user
      POSTGRES_PASSWORD: pet_password
      POSTGRES_DB: pet_dwh
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: local_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "9000:9000" # Порт для API (для Python-скриптов)
      - "9001:9001" # Порт для Web-интерфейса (браузер)
    volumes:
      - ./minio_data:/data
  grafana:
    image: grafana/grafana:latest
    container_name: local_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    # Добавляем маппинг локальной папки во внутреннюю директорию Графаны
    volumes:
      - ./grafana_data:/var/lib/grafana