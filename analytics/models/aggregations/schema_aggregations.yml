version: 2

models:
  - name: stats_by_clients
    columns:
      - name: client_natural_key
        description: "Natural business key of the client"
        tests:
          - not_null
      - name: report_month
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - client_natural_key
            - report_month

  - name: agg_monthly_client_kpis
    description: "Reporting Mart: monthly macro business indicators (KPIs) for the Tableau dashboard."
    columns:
      - name: report_month
        tests:
          - unique
          - not_null
      - name: monthly_trouble_free_ratio
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1

  - name: agg_monthly_client_segments
    description: "Reporting Mart: revenue and quality slices by client segments and nationalities."
    columns:
      - name: report_month
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - report_month
            - rider_profile_segment_at_month
            - loyalty_segment_at_month
            - nationality

  - name: stats_by_bikes
    description: "Sandbox Mart: monthly utilization, wear, mileage, and ROI for each bike."
    columns:
      - name: report_month
        tests:
          - not_null
      - name: bike_natural_key
        tests:
          - not_null
      - name: utilization_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: end_of_month_condition_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 10
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - report_month
            - bike_natural_key

  - name: stats_by_inventory
    description: "Sandbox Mart: monthly balance of warehouse inventory, sales, procurements, and turnover."
    columns:
      - name: report_month
        tests:
          - not_null
      - name: product_natural_key
        tests:
          - not_null
      - name: location_natural_key
        tests:
          - not_null
      - name: out_of_stock_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - report_month
            - product_natural_key
            - location_natural_key

  - name: agg_monthly_ops_kpis
    description: "Reporting Mart: top-level monthly KPIs for operational efficiency."
    columns:
      - name: report_month
        tests:
          - unique
          - not_null
      - name: fleet_utilization_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: warehouse_out_of_stock_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1

  - name: agg_monthly_fleet_utilization
    description: "Reporting Mart: utilization, technical condition, and ROI broken down by bike models."
    columns:
      - name: report_month
        tests:
          - not_null
      - name: model_utilization_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - report_month
            - brand
            - bike_type
            - bike_title

  - name: agg_monthly_supply_and_repairs
    description: "Reporting Mart: analysis of repair bottlenecks (Lead Time) and supply chain by location."
    columns:
      - name: report_month
        tests:
          - not_null
      - name: location_natural_key
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - report_month
            - location_natural_key